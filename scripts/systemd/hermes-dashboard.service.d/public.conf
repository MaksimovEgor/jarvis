# Drop-in к юниту дашборда Hermes (сам юнит пишет Hermes, его не правим).
# Снаружи дашборд доступен как https://point.abrdns.com:8447/ — Caddy на point →
# обратный SSH-туннель (jarvis-tunnel, :19119) → 127.0.0.1:9119. Поэтому слушаем
# только loopback, а не Tailscale-IP. Вход — dashboard.basic_auth из
# ~/.hermes/config.yaml; dashboard.public_url там же включает доверие к Host
# point.abrdns.com и X-Forwarded-Proto от прокси.
[Service]
Environment="HERMES_WEB_DIST=/home/e-maksimov/.hermes/web_dist_pwa"
ExecStartPre=/home/e-maksimov/jarvis/scripts/hermes-pwa/build_dist.sh
ExecStart=
ExecStart=/home/e-maksimov/.hermes/hermes-agent/venv/bin/python -m hermes_cli.main dashboard --host 127.0.0.1 --no-open
